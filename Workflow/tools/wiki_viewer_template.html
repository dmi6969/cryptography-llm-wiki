<title>Cryptography LLM Wiki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: reference wiki — sticky header, left index of 36 pages grouped by topic, one page shown at a time.
   Same palette as the slides: blue = data/links, gold = keys & source quotes. */
:root {
  --bg: #F3F5F9; --surface: #FFFFFF; --ink: #0F1B2D; --muted: #56657B; --line: #D5DCE6;
  --accent: #2352D6; --accent-soft: #E2E9FC; --key: #A86400; --key-soft: #FAEED8;
  --font-display: "Sora", "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --font-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0B1220; --surface: #131C2F; --ink: #E6EBF3; --muted: #9AA8BE; --line: #26334C;
    --accent: #85A7FF; --accent-soft: #1B2A52; --key: #F0B44C; --key-soft: #3B2A0D; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0B1220; --surface: #131C2F; --ink: #E6EBF3; --muted: #9AA8BE; --line: #26334C;
  --accent: #85A7FF; --accent-soft: #1B2A52; --key: #F0B44C; --key-soft: #3B2A0D; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
.top .name { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.top .name b { color: var(--accent); }
.top .sub { font-size: 13px; color: var(--muted); }
.wrap { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 28px; max-width: 1240px; margin: 0 auto;
  padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); align-self: start; max-height: calc(100vh - 90px); overflow-y: auto; font-size: 14px; }
nav .ng { margin: 14px 0 4px; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
nav ul { list-style: none; margin: 0; padding: 0; }
nav a { display: block; padding: 4px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; line-height: 1.45; }
nav a:hover { background: var(--accent-soft); }
nav a.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
details.navbox > summary { display: none; }
main { min-width: 0; }
.page { display: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px clamp(16px, 3vw, 36px) 32px; }
.page.on { display: block; }
.crumb { margin: 0; font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; color: var(--accent); text-transform: uppercase; }
h1 { font-family: var(--font-display); font-size: clamp(22px, 2.6vw, 30px); line-height: 1.3; margin: 4px 0 14px; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 19px; margin: 28px 0 8px; padding-top: 12px; border-top: 1px solid var(--line); }
h3 { font-size: 16px; margin: 20px 0 6px; }
p, li { max-width: 72ch; }
.meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0 0 8px; padding: 12px 14px; border-radius: 10px; background: var(--bg); font-size: 14px; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.meta .rt { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
table { border-collapse: collapse; font-size: 14px; display: block; overflow-x: auto; max-width: 100%; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
code { font-family: var(--font-mono); font-size: .88em; background: var(--bg); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; font-size: 13px; line-height: 1.55; }
pre code { background: none; padding: 0; }
pre.mermaid { background: var(--surface); }
blockquote { margin: 12px 0; padding: 8px 14px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 8px 8px 0; color: var(--muted); }
li.q { list-style: none; margin: 0 0 10px -18px; padding: 8px 12px; border-left: 3px solid var(--key); background: var(--key-soft); border-radius: 0 8px 8px 0; }
li.q .qref { display: block; font-family: var(--font-mono); font-size: 12px; color: var(--key); }
li.q q { font-family: Georgia, "Times New Roman", serif; font-size: 15px; }
.wl { text-decoration: none; border-bottom: 1px dotted var(--accent); }
@media (max-width: 860px) {
  .wrap { grid-template-columns: 1fr; gap: 14px; }
  nav { position: static; max-height: none; }
  details.navbox > summary { display: block; cursor: pointer; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 600; }
}
</style>

<header class="top">
  <span class="name">Cryptography <b>LLM Wiki</b></span>
  <span class="sub">{{COUNT}} 個知識節點 · 12 篇來源（NIST、IETF RFC、大學教材、原始論文）· 每條原文引文都經 Wiki Validation 逐字比對</span>
</header>
<div class="wrap">
  <nav aria-label="Wiki 目錄"><details class="navbox" id="navbox" open><summary>目錄</summary>
{{NAV}}
  </details></nav>
  <main id="main">
{{PAGES}}
  </main>
</div>
<script>
(() => {
  const pages = Array.from(document.querySelectorAll('.page'));
  const links = Array.from(document.querySelectorAll('nav a[data-target]'));
  const box = document.getElementById('navbox');
  function show(id) {
    const target = document.getElementById(id) || pages[0];
    pages.forEach(p => p.classList.toggle('on', p === target));
    links.forEach(a => a.classList.toggle('cur', a.dataset.target === target.id));
    window.scrollTo({ top: 0 });
  }
  window.addEventListener('hashchange', () => {
    show(location.hash.slice(1));
    if (window.matchMedia('(max-width: 860px)').matches && box) box.open = false;
  });
  show((location.hash || '').slice(1) || pages[0].id);
})();
</script>
